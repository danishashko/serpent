name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build app
        run: npm run build

      # --publish never, and no GH_TOKEN: with a token in scope electron-builder
      # creates its own GitHub release first, which the release step below then
      # reuses instead of its own draft. That left the release body empty and
      # uploaded the installer twice under two different names.
      - name: Build installer (unsigned)
        run: npx electron-builder --win --publish never --config.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ──────────────────────────────────────────────
      # SignPath Code Signing (enable after approval)
      # ──────────────────────────────────────────────
      # 1. Apply at https://signpath.io/apply
      # 2. Add SIGNPATH_API_TOKEN to GitHub Secrets
      # 3. Replace the org-id / project-slug / signing-policy-slug
      # 4. Uncomment the two steps below
      #
      # - name: Upload unsigned artifact
      #   id: upload-unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: serpent-unsigned
      #     path: release/*.exe
      #
      # - name: Submit signing request
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<your-signpath-org-id>'
      #     project-slug: 'serpent'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: release/signed

      # Checksums and provenance run last so they cover the final binary.
      # If SignPath is enabled above, point both at release/signed instead.
      - name: Generate checksums and verification notes
        shell: pwsh
        env:
          IS_PUBLIC: ${{ github.event.repository.private == false }}
        run: |
          $installer = Get-ChildItem release -Filter *.exe -File | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii

          $notes = @(
            '## Verify this download'
            ''
            'This installer is built by GitHub Actions directly from the tagged source in this repo. No local machine touches it.'
            ''
            '**SHA256**'
            ''
            '```'
            "$hash  $($installer.Name)"
            '```'
            ''
            '```powershell'
            "Get-FileHash '.\$($installer.Name)' -Algorithm SHA256"
            '```'
            ''
          )

          # Attestations only exist once the repo is public (see the attest step below).
          if ($env:IS_PUBLIC -eq 'true') {
            $notes += @(
              '**Build provenance**: confirm the binary was built from this repo and commit ([GitHub CLI](https://cli.github.com/) required).'
              ''
              '```'
              "gh attestation verify '.\$($installer.Name)' --repo ${{ github.repository }}"
              '```'
              ''
            )
          }

          # SignPath requires the literal term "Code signing policy" on the
          # download/release pages as well as the project home page.
          $notes += '## Code signing policy'
          $notes += ''
          $notes += 'Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).'
          $notes += ''
          $notes += 'Team roles and the full policy: [project README](https://github.com/${{ github.repository }}#code-signing-policy).'
          $notes += ''
          $notes += 'The SignPath Foundation application is pending, so this release is unsigned and Windows SmartScreen may warn on first run: **More info -> Run anyway**.'
          $notes += ''
          $notes | Set-Content release/RELEASE_NOTES.md -Encoding utf8

      # Artifact attestations need a public repo on Free/Pro/Team plans, so this
      # is skipped while serpent is private and turns itself on at the OSS flip.
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt
          body_path: release/RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
